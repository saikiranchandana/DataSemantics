      - name: product_margin_pct
        business_name: Product Margin Percentage
        description: >-
          Gross profit margin percentage by product. Calculated as (product line revenue - product line
          cost) / product line revenue * 100 for each product. Uses safe division to handle zero revenue
          scenarios. Result grain: one row per product.
        return_type: percentage
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    products.product_name,
                    CASE
                        WHEN SUM(order_items.line_revenue_usd) = 0 THEN 0
                        ELSE (SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd))
                             / NULLIF(SUM(order_items.line_revenue_usd), 0) * 100
                    END AS product_margin_pct
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                GROUP BY products.product_name
                ORDER BY product_margin_pct DESC
              columns_used:
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: supplier_reliability_avg
        business_name: Supplier Reliability Average
        description: >-
          Average reliability score across all suppliers. Calculates the mean of suppliers.reliability_score.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(suppliers.reliability_score) AS supplier_reliability_avg
                FROM suppliers
              columns_used:
                - suppliers.reliability_score