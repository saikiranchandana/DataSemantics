version: "1.0"

semantic_model:
  - name: customer_experience_analytics
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, employee management,
      and currency exchange operations. This model supports end-to-end analytical queries across the
      customer journey from signup through order placement, fulfillment, and delivery.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - CUSTOMERS: One row per customer. Contains customer profile and contact information.
        - ORDERS: One row per order. Contains order-level totals and metadata.
        - ORDER_ITEMS: One row per order line item. Multiple items can belong to one order.
        - PRODUCTS: One row per product. Contains product catalog information.
        - PRODUCT_CATEGORIES: One row per product category. Supports hierarchical category structure.
        - STORES: One row per store location.
        - SUPPLIERS: One row per supplier.
        - SHIPMENTS: One row per shipment. Contains shipment-level information.
        - SHIPMENT_ITEMS: One row per shipment line item. Multiple items can belong to one shipment.
        - EMPLOYEES: One row per employee. Supports hierarchical management structure.
        - CUSTOMER_ACCOUNT_MANAGERS: One row per customer-employee assignment with temporal validity.
        - CAMPAIGNS: One row per marketing campaign.
        - EXCHANGE_RATES: One row per currency per date. Supports as-of date currency conversion.
        
        ## Metric Selection Guide
        
        **Order-Level Revenue:**
        Use orders.total_amount_usd for order-level revenue analysis.
        Use orders.total_cost_usd for order-level cost analysis.
        
        **Order-Item-Level Revenue:**
        Use order_items.line_revenue_usd for product-level or order-item-level revenue analysis.
        Use order_items.line_cost_usd for product-level or order-item-level cost analysis.
        
        **CRITICAL: Double-Counting Prevention**
        Never sum orders.total_amount_usd after joining orders to order_items.
        Never sum orders.total_cost_usd after joining orders to order_items.
        When analyzing by product, use order_items.line_revenue_usd.
        When analyzing by order, use orders.total_amount_usd.
        
        ## Join Guidance
        
        **Standard Relationships:**
        - orders → customers via customer_id (many-to-one)
        - orders → stores via store_id (many-to-one)
        - order_items → orders via order_id (many-to-one)
        - order_items → products via product_id (many-to-one)
        - products → product_categories via category_id (many-to-one)
        - products → suppliers via supplier_id (many-to-one)
        - shipments → suppliers via supplier_id (many-to-one)
        - shipments → stores via store_id (many-to-one)
        - shipment_items → shipments via shipment_id (many-to-one)
        - shipment_items → products via product_id (many-to-one)
        
        **Hierarchical Relationships:**
        - product_categories → product_categories via parent_category_id (self-referencing hierarchy)
        - employees → employees via manager_id (self-referencing management hierarchy)
        
        **Temporal SCD Type-2 Relationship:**
        - orders → customer_account_managers: Join orders to the account manager assignment that was
          valid at the time of the order. Use order_date >= valid_from AND order_date < COALESCE(valid_to, '9999-12-31'::date).
        
        **As-Of Relationship:**
        - orders → exchange_rates: Join orders to the exchange rate that was effective on or before the
          order date for the order's currency. Use currency_code match and rate_date <= order_date::date,
          selecting the most recent rate.
        
        ## Time Analysis
        
        **Order Analysis:**
        Use orders.order_date for order placement time analysis.
        
        **Shipment Analysis:**
        Use shipments.ship_date for shipment departure time analysis.
        Use shipments.expected_arrival for expected delivery time analysis.
        Use shipments.actual_arrival for actual delivery time analysis.
        
        **Customer Analysis:**
        Use customers.signup_date for customer acquisition time analysis.
        Use customers.created_at for customer record creation time analysis.
        
        **Campaign Analysis:**
        Use campaigns.start_date and campaigns.end_date for campaign period analysis.
        
        **Employee Analysis:**
        Use employees.hire_date for employee tenure analysis.
        
        ## SCD Type-2 Guidance
        
        The CUSTOMER_ACCOUNT_MANAGERS table implements SCD Type-2 for tracking customer-to-employee
        assignments over time. Each assignment has:
        - valid_from: Start date of the assignment
        - valid_to: End date of the assignment (NULL indicates current assignment)
        
        To find the account manager for an order, join on:
        - customer_id match
        - order_date >= valid_from
        - order_date < COALESCE(valid_to, '9999-12-31'::date)
        
        ## As-Of Date Lookup
        
        The EXCHANGE_RATES table provides currency exchange rates by date. To convert order amounts:
        1. Match on currency_code
        2. Find the most recent rate where rate_date <= order_date
        3. Multiply local_amount by usd_rate to get USD equivalent
        
        ## Recursive Hierarchies
        
        **Product Category Hierarchy:**
        Use product_categories.parent_category_id to traverse the category hierarchy.
        Use recursive CTEs to calculate:
        - Category depth
        - Category path
        - Rollup aggregations across category levels
        
        **Employee Management Hierarchy:**
        Use employees.manager_id to traverse the management hierarchy.
        Use recursive CTEs to calculate:
        - Management level
        - Reporting chain
        - Team size
        - Span of control
        
        ## Computed Fields
        
        **Order Items:**
        - line_revenue_usd = quantity * unit_price_usd * (1 - discount_pct / 100.0)
        - line_cost_usd = quantity * unit_cost_usd
        
        These are computed fields documented in the glossary and should be used directly rather than
        recalculating unless the calculation grain differs.
        
        ## Query Restrictions
        
        - Always consider dataset grain before aggregating measures
        - Use appropriate date fields for time-based analysis
        - Handle NULL values in temporal validity (valid_to) and optional dates
        - Use safe division (NULLIF) for ratio and percentage calculations
        - Consider currency conversion when analyzing multi-currency orders
        - Respect hierarchical relationships when aggregating across levels
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Stores comprehensive customer profiles including contact details, location, segment classification,
          and signup information. Grain: One row per customer. Primary analytical entity for customer-centric
          analysis.
        source: CUSTOMERS
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer.
            sql_type: VARCHAR(20)
            constraints: []
          
          - name: city
            business_name: City
            description: City where the customer is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the customer is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: orders
        business_name: Orders
        description: >-
          Records end-to-end sales transactions including order metadata, customer reference, store reference,
          payment information, order status, and order-level totals. Grain: One row per order. Primary
          analytical entity for order-level revenue and transaction analysis.
        source: ORDERS
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_channel
            business_name: Order Channel
            description: Channel through which the order was placed.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: payment_method
            business_name: Payment Method
            description: Method used by the customer to pay for the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: order_status
            business_name: Order Status
            description: Current status of the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: is_returned
            business_name: Is Returned
            description: Indicates whether the order has been returned.
            sql_type: BOOL
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience.
            sql_type: INT2
            constraints: []
          
          - name: currency_code
            business_name: Currency Code
            description: Currency code used for the order amounts.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: total_amount_usd
            business_name: Total Amount USD
            description: Total order amount in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
          
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency.
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
          
          - name: total_cost_usd
            business_name: Total Cost USD
            description: Total cost of fulfilling the order in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Records individual line items within orders including product reference, quantity, pricing,
          discounts, and calculated line-level revenue and cost. Grain: One row per order line item.
          Primary analytical entity for product-level revenue analysis.
        source: ORDER_ITEMS
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: order_id
            business_name: Order Reference
            description: References the related order record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered.
            sql_type: INT4
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the order item.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
          
          - name: line_revenue_usd
            business_name: Line Revenue USD
            description: Calculated revenue for the order item line in USD after discounts.
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
          
          - name: line_cost_usd
            business_name: Line Cost USD
            description: Calculated cost for the order item line in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
      
      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including product name, category reference, supplier reference,
          cost and pricing information. Grain: One row per product. Primary analytical entity for product
          performance analysis.
        source: PRODUCTS
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: product_name
            business_name: Product Name
            description: Name or title of the product.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Reference
            description: References the category to which the product belongs.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost to acquire or produce one unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category definitions supporting hierarchical category structure via parent
          category reference. Grain: One row per product category. Supports recursive category hierarchy
          analysis.
        source: PRODUCT_CATEGORIES
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category Reference
            description: References the parent category in the hierarchy.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
      
      - name: stores
        business_name: Stores
        description: >-
          Contains store location and metadata including store name, location, and store type. Grain: One
          row per store. Primary analytical entity for store performance analysis.
        source: STORES
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: store_name
            business_name: Store Name
            description: Name of the store.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: city
            business_name: City
            description: City where the store is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the store is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: store_type
            business_name: Store Type
            description: Type or format of the store, such as online or physical.
            sql_type: VARCHAR(30)
            constraints: []
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: suppliers
        business_name: Suppliers
        description: >-
          Contains supplier organization information including supplier name, country, contact information,
          and reliability score. Grain: One row per supplier. Primary analytical entity for supplier
          performance analysis.
        source: SUPPLIERS
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: country
            business_name: Country
            description: Country where the supplier is based.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: contact_email
            business_name: Contact Email
            description: Email address for contacting the supplier.
            sql_type: VARCHAR(150)
            constraints: []
          
          - name: reliability_score
            business_name: Reliability Score
            description: Score indicating the reliability of the supplier.
            sql_type: NUMERIC(3,2)
            constraints: []
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment information including supplier reference, destination store reference, shipment
          dates, freight cost, and shipment status. Grain: One row per shipment. Primary analytical entity
          for shipment and logistics analysis.
        source: SHIPMENTS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier responsible for the shipment.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the destination store for the shipment.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment departed.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          
          - name: actual_arrival
            business_name: Actual Arrival
            description: Actual arrival date of the shipment.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          
          - name: freight_cost_usd
            business_name: Freight Cost USD
            description: Freight cost of the shipment in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: shipment_status
            business_name: Shipment Status
            description: Current status of the shipment.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Contains individual line items within shipments including product reference and quantity. Grain:
          One row per shipment line item. Primary analytical entity for shipment item-level analysis.
        source: SHIPMENT_ITEMS
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: shipment_id
            business_name: Shipment Reference
            description: References the shipment containing the item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the shipment item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product in the shipment item.
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: employees
        business_name: Employees
        description: >-
          Maintains employee records including employee name, role, manager reference, region, and hire date.
          Grain: One row per employee. Supports hierarchical management structure via manager reference.
        source: EMPLOYEES
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: role
            business_name: Role
            description: Job role or position of the employee.
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: manager_id
            business_name: Manager Reference
            description: References the employee who manages this employee.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
          
          - name: region
            business_name: Region
            description: Geographic region assigned to the employee.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: hire_date
            business_name: Hire Date
            description: Date when the employee was hired.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Stores customer-to-employee assignment history with temporal validity tracking. Implements SCD
          Type-2 pattern with valid_from and valid_to dates. Grain: One row per customer-employee assignment
          per validity period. Supports historical account manager assignment analysis.
        source: CUSTOMER_ACCOUNT_MANAGERS
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: employee_id
            business_name: Employee Reference
            description: References the employee assigned as the account manager.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: valid_from
            business_name: Valid From
            description: Date when the account manager assignment becomes effective.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: valid_to
            business_name: Valid To
            description: Date when the account manager assignment ends.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Contains marketing campaign information including campaign name, channel, target segment, campaign
          period, and discount offered. Grain: One row per marketing campaign. Primary analytical entity for
          campaign performance analysis.
        source: CAMPAIGNS
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: channel
            business_name: Channel
            description: Marketing channel used to run the campaign.
            sql_type: VARCHAR(20)
            constraints: []
            dimension:
              is_time: false
          
          - name: target_segment
            business_name: Target Segment
            description: Customer segment targeted by the campaign.
            sql_type: VARCHAR(20)
            constraints: []
            dimension:
              is_time: false
          
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount offered by the campaign.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
      
      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Contains currency exchange rates by currency code and date. Grain: One row per currency per date.
          Supports as-of date currency conversion for multi-currency order analysis.
        source: EXCHANGE_RATES
        primary_key:
          - currency_code
          - rate_date
        fields:
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code for the exchange rate.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
          
          - name: rate_date
            business_name: Rate Date
            description: Date for which the exchange rate applies.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: usd_rate
            business_name: USD Rate
            description: Exchange rate of the currency against USD.
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is placed by exactly one customer. Multiple orders
          can belong to the same customer. Join on customer_id equality.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is fulfilled by exactly one store. Multiple orders
          can be fulfilled by the same store. Join on store_id equality.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item belongs to exactly one order. Multiple order
          items can belong to the same order. Join on order_id equality. CRITICAL: When joining order_items
          to orders, do not sum order-level measures (orders.total_amount_usd, orders.total_cost_usd) as
          this will cause double counting. Use order_items.line_revenue_usd and order_items.line_cost_usd
          for item-level analysis.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item references exactly one product. Multiple order
          items can reference the same product. Join on product_id equality.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product belongs to exactly one category. Multiple products
          can belong to the same category. Join on category_id equality.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product is provided by exactly one supplier. Multiple
          products can be provided by the same supplier. Join on supplier_id equality.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment originates from exactly one supplier. Multiple
          shipments can originate from the same supplier. Join on supplier_id equality.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment is destined for exactly one store. Multiple
          shipments can be destined for the same store. Join on store_id equality.
      
      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item belongs to exactly one shipment. Multiple
          shipment items can belong to the same shipment. Join on shipment_id equality.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item references exactly one product. Multiple
          shipment items can reference the same product. Join on product_id equality.
      
      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each assignment references exactly one customer. Multiple
          assignments (across different time periods) can reference the same customer. Join on customer_id
          equality.
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each assignment references exactly one employee. Multiple
          assignments can reference the same employee. Join on employee_id equality.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Recursive hierarchical relationship. Each category can have a parent category, creating a
          hierarchical category structure. Join on parent_category_id = category_id. Use recursive CTEs to
          traverse the full hierarchy, calculate category depth, build category paths, or perform rollup
          aggregations across category levels. NULL parent_category_id indicates a root category.
      
      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Recursive hierarchical relationship. Each employee can have a manager, creating a hierarchical
          management structure. Join on manager_id = employee_id. Use recursive CTEs to traverse the full
          management hierarchy, calculate management levels, build reporting chains, calculate team sizes,
          or analyze span of control. NULL manager_id indicates a top-level executive.
      
      - name: orders_to_customer_account_managers_scd
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship. Join orders to the customer account manager assignment that was
          valid at the time of the order. Match on customer_id and apply temporal logic: order_date >=
          valid_from AND order_date < COALESCE(valid_to, '9999-12-31'::date). This returns the account
          manager who was assigned to the customer when the order was placed. NULL valid_to indicates the
          current assignment.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: as_of
        resolution: >-
          As-of date relationship. Join orders to the most recent exchange rate that was effective on or
          before the order date for the order's currency. Match on currency_code and apply temporal logic:
          rate_date <= order_date::date, then select the record with the maximum rate_date. This returns
          the exchange rate that should be used to convert the order's local_amount to USD equivalent.
    
    metrics:
      - name: total_revenue_usd
        business_name: Total Revenue USD
        description: >-
          Total order revenue in USD across all orders. Aggregates orders.total_amount_usd at order grain.
          Use this metric for order-level revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
      
      - name: total_cost_usd
        business_name: Total Cost USD
        description: >-
          Total order cost in USD across all orders. Aggregates orders.total_cost_usd at order grain. Use
          this metric for order-level cost analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost_usd
                FROM orders
              columns_used:
                - orders.total_cost_usd
      
      - name: gross_profit_usd
        business_name: Gross Profit USD
        description: >-
          Total gross profit in USD calculated as total revenue minus total cost at order grain. Represents
          the profit before operating expenses.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross profit margin as a percentage of revenue. Calculated as (total revenue - total cost) /
          total revenue * 100. Uses safe division to handle zero revenue scenarios.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd)) 
                             / NULLIF(SUM(orders.total_amount_usd), 0) * 100
                    END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Counts distinct order_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers. Counts distinct customer_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: average_order_value_usd
        business_name: Average Order Value USD
        description: >-
          Average order value in USD. Calculated as total revenue divided by number of orders. Uses safe
          division to handle zero order scenarios.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.order_id), 0) AS average_order_value_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
      
      - name: product_line_revenue_usd
        business_name: Product Line Revenue USD
        description: >-
          Total product-level revenue in USD across all order items. Aggregates order_items.line_revenue_usd
          at order item grain. Use this metric for product-level revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) AS product_line_revenue_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
      
      - name: product_line_cost_usd
        business_name: Product Line Cost USD
        description: >-
          Total product-level cost in USD across all order items. Aggregates order_items.line_cost_usd at
          order item grain. Use this metric for product-level cost analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_cost_usd) AS product_line_cost_usd
                FROM order_items
              columns_used:
                - order_items.line_cost_usd
      
      - name: product_line_profit_usd
        business_name: Product Line Profit USD
        description: >-
          Total product-level profit in USD calculated as product line revenue minus product line cost at
          order item grain.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) AS product_line_profit_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order items. Aggregates order_items.quantity.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: average_selling_price_usd
        business_name: Average Selling Price USD
        description: >-
          Average selling price per unit in USD. Calculated as total product line revenue divided by total
          units sold. Uses safe division to handle zero quantity scenarios.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) / NULLIF(SUM(order_items.quantity), 0) AS average_selling_price_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
                - order_items.quantity
      
      - name: total_discount_amount_usd
        business_name: Total Discount Amount USD
        description: >-
          Total discount amount in USD across all order items. Calculated as the difference between
          undiscounted revenue and actual line revenue.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity * order_items.unit_price_usd) 
                    - SUM(order_items.line_revenue_usd) AS total_discount_amount_usd
                FROM order_items
              columns_used:
                - order_items.quantity
                - order_items.unit_price_usd
                - order_items.line_revenue_usd
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all order items weighted by line revenue. Calculated as total
          discount amount divided by undiscounted revenue. Uses safe division to handle zero revenue
          scenarios.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (SUM(order_items.quantity * order_items.unit_price_usd) - SUM(order_items.line_revenue_usd))
                    / NULLIF(SUM(order_items.quantity * order_items.unit_price_usd), 0) * 100 AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.quantity
                - order_items.unit_price_usd
                - order_items.line_revenue_usd
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Counts distinct shipment_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: total_freight_cost_usd
        business_name: Total Freight Cost USD
        description: >-
          Total freight cost in USD across all shipments. Aggregates shipments.freight_cost_usd.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS total_freight_cost_usd
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: average_freight_cost_usd
        business_name: Average Freight Cost USD
        description: >-
          Average freight cost per shipment in USD. Calculated as total freight cost divided by number of
          shipments. Uses safe division to handle zero shipment scenarios.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) / NULLIF(COUNT(DISTINCT shipments.shipment_id), 0) AS average_freight_cost_usd
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
                - shipments.shipment_id
      
      - name: units_shipped
        business_name: Units Shipped
        description: >-
          Total number of product units shipped across all shipment items. Aggregates shipment_items.quantity.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS units_shipped
                FROM shipment_items
              columns_used:
                - shipment_items.quantity
      
      - name: delayed_shipment_count
        business_name: Delayed Shipment Count
        description: >-
          Number of shipments that arrived later than expected. Counts shipments where actual_arrival >
          expected_arrival. Only considers shipments with both dates populated.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT shipments.shipment_id) AS delayed_shipment_count
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
                  AND shipments.expected_arrival IS NOT NULL
                  AND shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: on_time_delivery_pct
        business_name: On-Time Delivery Percentage
        description: >-
          Percentage of shipments that arrived on or before the expected arrival date. Calculated as
          (total shipments - delayed shipments) / total shipments * 100. Only considers shipments with
          both actual and expected arrival dates. Uses safe division to handle zero shipment scenarios.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (COUNT(DISTINCT CASE 
                        WHEN shipments.actual_arrival IS NOT NULL 
                         AND shipments.expected_arrival IS NOT NULL 
                        THEN shipments.shipment_id 
                    END)
                    - COUNT(DISTINCT CASE 
                        WHEN shipments.actual_arrival IS NOT NULL 
                         AND shipments.expected_arrival IS NOT NULL 
                         AND shipments.actual_arrival > shipments.expected_arrival 
                        THEN shipments.shipment_id 
                    END))
                    / NULLIF(COUNT(DISTINCT CASE 
                        WHEN shipments.actual_arrival IS NOT NULL 
                         AND shipments.expected_arrival IS NOT NULL 
                        THEN shipments.shipment_id 
                    END), 0) * 100 AS on_time_delivery_pct
                FROM shipments
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average number of days by which delayed shipments arrived late. Calculated as the average
          difference between actual_arrival and expected_arrival for shipments where actual_arrival >
          expected_arrival. Only considers delayed shipments.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
                  AND shipments.expected_arrival IS NOT NULL
                  AND shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: returned_order_count
        business_name: Returned Order Count
        description: >-
          Number of orders that have been returned. Counts orders where is_returned = true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT orders.order_id) AS returned_order_count
                FROM orders
                WHERE orders.is_returned = true
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that have been returned. Calculated as returned orders / total orders * 100.
          Uses safe division to handle zero order scenarios.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT CASE WHEN orders.is_returned = true THEN orders.order_id END)
                    / NULLIF(COUNT(DISTINCT orders.order_id), 0) * 100 AS return_rate_pct
                FROM orders
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across all orders with ratings. Calculates the mean of customer_rating
          where rating is not null.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating
      
      - name: revenue_per_customer_usd
        business_name: Revenue Per Customer USD
        description: >-
          Average revenue per customer in USD. Calculated as total revenue divided by number of unique
          customers who placed orders. Uses safe division to handle zero customer scenarios.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Calculated as total orders divided by number of unique
          customers who placed orders. Uses safe division to handle zero customer scenarios.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT orders.order_id) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products in the catalog. Counts distinct product_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT products.product_id) AS product_count
                FROM products
              columns_used:
                - products.product_id
      
      - name: supplier_count
        business_name: Supplier Count
        description: >-
          Total number of unique suppliers. Counts distinct supplier_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
